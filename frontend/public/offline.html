<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f4f0">
  <title>Offline · Stockwise</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f4f0; color: #1f201e;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 22rem; padding: 1.5rem; text-align: center; }
    img { width: 56px; height: 56px; border-radius: 14px; }
    h1 { margin: 1.25rem 0 0.5rem; font-size: 1.5rem; }
    p { margin: 0; color: rgb(31 32 30 / 0.7); line-height: 1.5; }
    .en { margin-top: 0.75rem; font-size: 0.875rem; }
    button { margin-top: 1.5rem; padding: 0.75rem 1.5rem; border: 0; border-radius: 0.5rem; background: #1f201e;
      color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>Kamu sedang offline</h1>
    <p>Stockwise butuh internet supaya stok dan transaksi tetap cocok. Cek sinyal atau Wi-Fi, lalu coba lagi.</p>
    <p class="en">You're offline. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
  </main>
</body>
</html>
