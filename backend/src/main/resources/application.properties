spring.application.name=stockwise

# Secret dev: buat file backend/.env berisi JWT_SECRET=<minimal 32 karakter> (lihat .env.example)
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/stockwise}
spring.datasource.username=${DB_USER:stockwise}
spring.datasource.password=${DB_PASSWORD:stockwise}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Semua DATETIME disimpan UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

stockwise.jwt.secret=${JWT_SECRET}

# Pembatas percobaan login/daftar per IP
stockwise.rate-limit.auth-max=10
stockwise.rate-limit.window-seconds=60

# Healthcheck untuk deploy; hanya status, tanpa rincian
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-stacktrace=never

# ===================== PLACEHOLDER OLLAMA (insight LLM) =====================
# Isi lewat environment atau backend/.env (contoh ada di .env.example). Kode yang memakainya: OllamaClient.
# OLLAMA_MODEL kosong = belum dikonfigurasi: insight tetap jalan memakai teks template (model "template").
stockwise.ollama.url=${OLLAMA_URL:http://localhost:11434}
stockwise.ollama.model=${OLLAMA_MODEL:}
stockwise.ollama.api-key=${OLLAMA_API_KEY:}
stockwise.ollama.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:60}
# lama menunggu giliran bila model sedang dipakai, sebelum dijawab 503 INSIGHT_BUSY
stockwise.ollama.queue-wait-seconds=${OLLAMA_QUEUE_WAIT_SECONDS:5}
# ============================================================================

# Harga/jumlah bulat tidak boleh dipotong diam-diam dari pecahan (10.5 -> 10)
spring.jackson.deserialization.accept-float-as-int=false
