# Profil khusus tools/simulator. JANGAN dipakai di server sungguhan: jam server bisa digeser lewat /api/v1/dev/clock.
# Dijalankan dengan: SPRING_PROFILES_ACTIVE=simulation ./mvnw spring-boot:run
# Penutup otomatis dimatikan: simulator menutup sesi sendiri, dan jam simulasi tidak boleh memicu penutup di tengah hari.
stockwise.auto-close.enabled=false
# Simulator mendaftar/login berkali-kali dalam waktu singkat
stockwise.rate-limit.auth-max=100000
